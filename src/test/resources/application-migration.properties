spring.datasource.url=${MIGRATION_DB_URL:jdbc:mysql://localhost:3306/clinic_migration?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${MIGRATION_DB_USER:clinic}
spring.datasource.password=${MIGRATION_DB_PASSWORD}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
app.ai.ollama.enabled=false
app.mail.enabled=false
app.sms.enabled=false
