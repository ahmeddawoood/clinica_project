spring.application.name=clinic
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:mysql://localhost:3306/clinic?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.connection.characterEncoding=utf8mb4
spring.jpa.properties.hibernate.connection.useUnicode=true
server.port=${PORT:8082}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.thymeleaf.encoding=UTF-8
spring.messages.encoding=UTF-8
spring.mail.default-encoding=UTF-8
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.booking-fee-cents=200
stripe.currency=usd
payment.coupon-code=${PAYMENT_COUPON_CODE:}
app.base-url=${APP_BASE_URL:}
payment.demo-fallback-enabled=false
deepseek.api.key=${DEEPSEEK_API_KEY:}
deepseek.api.url=https://api.deepseek.com/chat/completions
deepseek.model=deepseek-chat
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:noreply@mediclinic.ro}
app.mail.enabled=${MAIL_ENABLED:false}
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.phone-number=${TWILIO_PHONE_NUMBER:}
app.sms.enabled=${SMS_ENABLED:false}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=MediClinic
info.app.description=Platforma de management al clinicii medicale
info.app.version=1.0.0
info.app.university=Universitatea Politehnica Timisoara
info.app.faculty=Facultatea de Automatica si Calculatoare
info.app.java-version=21
info.app.framework=Spring Boot 4.0.5
info.app.swagger-ui=${APP_BASE_URL:http://localhost:8082}/swagger-ui/index.html
info.app.health=${APP_BASE_URL:http://localhost:8082}/actuator/health
