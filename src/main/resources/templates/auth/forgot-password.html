<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resetare parolă - MediClinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h2 class="auth-title">Ai uitat parola?</h2>
        <p class="auth-subtitle">Introduceți adresa de email și vă trimitem un link de resetare.</p>

        <div th:if="${param.sent}" class="alert alert-success d-flex align-items-center gap-2 mb-3">
            <i class="bi bi-check-circle-fill fs-5"></i>
            <div>
                <strong>Link trimis!</strong><br>
                <small>Dacă adresa există în sistem, veți primi un email cu instrucțiuni. Verificați și folderul Spam.</small>
            </div>
        </div>

        <form th:action="@{/forgot-password}" method="post" th:unless="${param.sent}">
            <div class="mb-4">
                <label class="form-label">Adresă email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="email" class="form-control"
                           placeholder="email@example.com" required autofocus>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                <i class="bi bi-send me-1"></i> Trimite link de resetare
            </button>
        </form>

        <div class="text-center mt-2">
            <a th:href="@{/login}" class="text-decoration-none text-muted small">
                <i class="bi bi-arrow-left me-1"></i> Înapoi la login
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
