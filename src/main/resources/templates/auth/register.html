<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Înregistrare - MediClinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<div class="min-vh-100 d-flex align-items-center justify-content-center py-4" style="background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="auth-card" style="max-width:100%">
                    <div class="text-center mb-4">
                        <div class="auth-logo"><i class="bi bi-heart-pulse-fill"></i></div>
                        <h2 class="auth-title">Creare cont</h2>
                        <p class="auth-subtitle">Alatura-te platformei MediClinic</p>
                    </div>

                    <div th:if="${param.success}" class="alert alert-success d-flex align-items-center gap-2">
                        <i class="bi bi-check-circle-fill"></i>
                        <div>
                            <strong th:if="${param.type != null and param.type[0] == 'doctor'}">Cont de doctor creat cu succes!</strong>
                            <strong th:if="${param.type == null or param.type[0] != 'doctor'}">Cont de pacient creat cu succes!</strong>
                            <a th:href="@{/login}" class="fw-600 ms-1">Logheaza-te acum</a>
                        </div>
                    </div>
                    <div th:if="${emailError}" class="alert alert-danger d-flex align-items-center gap-2" th:text="${emailError}"></div>

                    <form th:action="@{/register}" th:object="${form}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        
                        <label class="form-label fw-600">Alege tipul de cont</label>
                        <div class="row g-2 mb-4">
                            <div class="col-6">
                                <input type="radio" class="btn-check" name="role" id="rolePatient" value="PATIENT" th:checked="${form.role == null or form.role == 'PATIENT'}" autocomplete="off">
                                <label class="btn btn-outline-primary w-100 py-3 d-flex flex-column align-items-center gap-1" for="rolePatient" style="height:100px;">
                                    <i class="bi bi-person-fill" style="font-size:2rem;"></i>
                                    <span class="fw-600">Pacient</span>
                                    <small class="text-muted" style="font-size:.7rem;">Vreau sa ma programez</small>
                                </label>
                            </div>
                            <div class="col-6">
                                <input type="radio" class="btn-check" name="role" id="roleDoctor" value="DOCTOR" th:checked="${form.role == 'DOCTOR'}" autocomplete="off">
                                <label class="btn btn-outline-success w-100 py-3 d-flex flex-column align-items-center gap-1" for="roleDoctor" style="height:100px;">
                                    <i class="bi bi-clipboard2-pulse-fill" style="font-size:2rem;"></i>
                                    <span class="fw-600">Doctor</span>
                                    <small class="text-muted" style="font-size:.7rem;">Sunt medic / specialist</small>
                                </label>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col mb-3">
                                <label class="form-label">Prenume</label>
                                <input type="text" th:field="*{firstName}"
                                       th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'"
                                       class="form-control" placeholder="Ion">
                                <div class="invalid-feedback" th:errors="*{firstName}"></div>
                            </div>
                            <div class="col mb-3">
                                <label class="form-label">Nume</label>
                                <input type="text" th:field="*{lastName}"
                                       th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'"
                                       class="form-control" placeholder="Popescu">
                                <div class="invalid-feedback" th:errors="*{lastName}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                   class="form-control" placeholder="ion.popescu@email.com">
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Parola <small class="text-muted">(minim 6 caractere)</small></label>
                            <input type="password" th:field="*{password}"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                   class="form-control" placeholder="••••••••">
                            <div class="invalid-feedback" th:errors="*{password}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Telefon</label>
                            <input type="text" th:field="*{phone}" class="form-control" placeholder="07xx xxx xxx">
                        </div>

                        
                        <div class="mb-3" id="specialtyField" style="display:none;">
                            <label class="form-label">Specializare <span class="text-danger">*</span></label>
                            <select th:field="*{specialty}"
                                    th:classappend="${specialtyError} ? 'is-invalid'"
                                    class="form-select">
                                <option value="">- Selecteaza specializarea -</option>
                                <option value="Medicina Generala">Medicina Generala</option>
                                <option value="Cardiologie">Cardiologie</option>
                                <option value="Neurologie">Neurologie</option>
                                <option value="Pediatrie">Pediatrie</option>
                                <option value="Dermatologie">Dermatologie</option>
                                <option value="Ortopedie">Ortopedie</option>
                                <option value="Oftalmologie">Oftalmologie</option>
                                <option value="Ginecologie">Ginecologie</option>
                                <option value="Stomatologie">Stomatologie</option>
                                <option value="Psihiatrie">Psihiatrie</option>
                                <option value="Endocrinologie">Endocrinologie</option>
                                <option value="Oncologie">Oncologie</option>
                            </select>
                            <div class="invalid-feedback" th:if="${specialtyError}" th:text="${specialtyError}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2">
                            <i class="bi bi-person-check-fill me-1"></i> Creeaza cont
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <small class="text-muted">Ai deja cont?
                            <a th:href="@{/login}" class="text-decoration-none fw-600">Logheaza-te</a>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<script>
    const specialtyField = document.getElementById('specialtyField');
    const roleRadios = document.querySelectorAll('input[name="role"]');

    function updateSpecialty() {
        const selected = document.querySelector('input[name="role"]:checked');
        if (selected && selected.value === 'DOCTOR') {
            specialtyField.style.display = 'block';
        } else {
            specialtyField.style.display = 'none';
        }
    }

    roleRadios.forEach(r => r.addEventListener('change', updateSpecialty));
    updateSpecialty();
</script>
</body>
</html>
