<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Parolă nouă - MediClinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <i class="bi bi-key-fill"></i>
        </div>
        <h2 class="auth-title">Parolă nouă</h2>
        <p class="auth-subtitle">Introduceți noua parolă pentru contul dvs.</p>

        
        <div th:if="${tokenError}" class="alert alert-danger d-flex align-items-center gap-2 mb-3">
            <i class="bi bi-x-circle-fill fs-5"></i>
            <div>
                <strong>Link invalid sau expirat.</strong><br>
                <small>Solicitați un <a th:href="@{/forgot-password}" class="alert-link">nou link de resetare</a>.</small>
            </div>
        </div>

        
        <div th:if="${error}" class="alert alert-danger d-flex align-items-center gap-2 mb-3">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/reset-password}" method="post" th:unless="${tokenError}" id="resetForm">
            <input type="hidden" name="token" th:value="${token}">

            <div class="mb-3">
                <label class="form-label">Parolă nouă</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" id="passwordInput" class="form-control"
                           placeholder="Minim 6 caractere" minlength="6" required autofocus>
                    <button class="btn btn-outline-secondary" type="button" id="togglePwd">
                        <i class="bi bi-eye" id="eyeIcon1"></i>
                    </button>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Confirmă parola</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" name="confirmPassword" id="confirmInput" class="form-control"
                           placeholder="Repetați parola" minlength="6" required>
                    <button class="btn btn-outline-secondary" type="button" id="toggleConfirm">
                        <i class="bi bi-eye" id="eyeIcon2"></i>
                    </button>
                </div>
                <div id="matchFeedback" class="form-text text-danger d-none">
                    <i class="bi bi-x-circle me-1"></i>Parolele nu coincid.
                </div>
            </div>

            
            <div class="mb-3">
                <div class="progress" style="height:4px;">
                    <div id="strengthBar" class="progress-bar" style="width:0%;transition:width .3s,background .3s;"></div>
                </div>
                <small id="strengthLabel" class="text-muted"></small>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mb-3" id="submitBtn">
                <i class="bi bi-check-lg me-1"></i> Salvează parola nouă
            </button>
        </form>

        <div class="text-center mt-2">
            <a th:href="@{/login}" class="text-decoration-none text-muted small">
                <i class="bi bi-arrow-left me-1"></i> Înapoi la login
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function toggleVis(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon  = document.getElementById(iconId);
        input.type = input.type === 'password' ? 'text' : 'password';
        icon.className = input.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
    }
    document.getElementById('togglePwd').addEventListener('click', () => toggleVis('passwordInput', 'eyeIcon1'));
    document.getElementById('toggleConfirm').addEventListener('click', () => toggleVis('confirmInput', 'eyeIcon2'));
    const pwd = document.getElementById('passwordInput');
    const bar = document.getElementById('strengthBar');
    const lbl = document.getElementById('strengthLabel');
    pwd.addEventListener('input', () => {
        const v = pwd.value;
        let score = 0;
        if (v.length >= 6)  score++;
        if (v.length >= 10) score++;
        if (/[A-Z]/.test(v)) score++;
        if (/[0-9]/.test(v)) score++;
        if (/[^A-Za-z0-9]/.test(v)) score++;
        const levels = [
            { w: '0%',   c: '',              t: '' },
            { w: '25%',  c: 'bg-danger',     t: 'Slabă' },
            { w: '50%',  c: 'bg-warning',    t: 'Medie' },
            { w: '75%',  c: 'bg-info',       t: 'Bună' },
            { w: '90%',  c: 'bg-success',    t: 'Foarte bună' },
            { w: '100%', c: 'bg-success',    t: 'Excelentă' },
        ];
        const l = levels[score] || levels[0];
        bar.style.width = l.w;
        bar.className = 'progress-bar ' + l.c;
        lbl.textContent = l.t;
    });
    const confirm = document.getElementById('confirmInput');
    const feedback = document.getElementById('matchFeedback');
    function checkMatch() {
        if (confirm.value.length === 0) { feedback.classList.add('d-none'); return; }
        feedback.classList.toggle('d-none', pwd.value === confirm.value);
    }
    pwd.addEventListener('input', checkMatch);
    confirm.addEventListener('input', checkMatch);
    document.getElementById('resetForm')?.addEventListener('submit', e => {
        if (pwd.value !== confirm.value) { e.preventDefault(); feedback.classList.remove('d-none'); }
    });
</script>
</body>
</html>
