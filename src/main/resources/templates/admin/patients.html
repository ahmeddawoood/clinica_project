<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pacienți | Admin MediClinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/admin-nav :: sidebar}"></div>
    <div id="sidebarOverlay" class="d-none position-fixed top-0 start-0 w-100 h-100"
         style="background:rgba(0,0,0,.4);z-index:99;"></div>

    <div class="main-content">
        <div th:replace="~{fragments/admin-nav :: topbar('Pacienți')}"></div>

        <div class="page-content">
            <div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div>
                    <nav aria-label="breadcrumb" class="mb-1">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}" class="text-decoration-none">Dashboard</a></li>
                            <li class="breadcrumb-item active">Pacienți</li>
                        </ol>
                    </nav>
                    <h2 class="mb-0"><i class="bi bi-people-fill me-2 text-primary"></i>Pacienți înregistrați</h2>
                    <p class="text-muted small mb-0" th:text="'Total: ' + ${#lists.size(patients)} + ' pacienți'"></p>
                </div>
                <a th:href="@{/admin/export/appointments}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-download me-1"></i>Exportă CSV
                </a>
            </div>

            <div class="content-card">
                <div class="content-card-header">
                    <h5 class="content-card-title"><i class="bi bi-table me-2"></i>Lista pacienților</h5>
                    <div class="d-flex gap-2 align-items-center">
                        <input type="text" class="form-control form-control-sm" placeholder="Caută..."
                               data-search-table="patientsTable" style="width:200px;">
                    </div>
                </div>
                <div class="content-card-body p-0">
                    <div th:if="${#lists.isEmpty(patients)}" class="text-center py-5 text-muted">
                        <i class="bi bi-people fs-1 d-block mb-2 opacity-25"></i>
                        Nu există pacienți înregistrați.
                    </div>
                    <div class="table-responsive" th:unless="${#lists.isEmpty(patients)}">
                        <table class="clinic-table" id="patientsTable" data-paginate="15">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Pacient</th>
                                    <th>Email</th>
                                    <th>Telefon</th>
                                    <th>Gen</th>
                                    <th>Data nașterii</th>
                                    <th>Grup sangvin</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="p : ${patients}">
                                    <td class="text-muted small" th:text="${p.id}"></td>
                                    <td>
                                        <div class="d-flex align-items-center gap-2">
                                            <div class="avatar" style="background:#dbeafe;color:#1d4ed8;font-size:.8rem;">
                                                <span th:text="${p.firstName != null ? p.firstName.substring(0,1).toUpperCase() : 'P'}"></span>
                                            </div>
                                            <div>
                                                <div class="fw-600" th:text="${p.fullName}"></div>
                                                <div class="text-muted small" th:if="${p.address}" th:text="${p.address}"></div>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="small" th:text="${p.user != null ? p.user.email : '-'}"></td>
                                    <td class="small" th:text="${p.phone ?: '-'}"></td>
                                    <td>
                                        <span th:if="${p.gender == 'M'}" class="badge" style="background:#dbeafe;color:#1d4ed8;">M</span>
                                        <span th:if="${p.gender == 'F'}" class="badge" style="background:#fce7f3;color:#be185d;">F</span>
                                        <span th:unless="${p.gender == 'M' or p.gender == 'F'}" class="text-muted">-</span>
                                    </td>
                                    <td class="small" th:text="${p.dateOfBirth != null ? #temporals.format(p.dateOfBirth, 'dd MMM yyyy') : '-'}"></td>
                                    <td>
                                        <span th:if="${p.bloodType}" class="badge bg-danger-subtle text-danger"
                                              th:text="${p.bloodType}"></span>
                                        <span th:unless="${p.bloodType}" class="text-muted">-</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
