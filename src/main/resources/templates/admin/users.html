<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Utilizatori | Admin MediClinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/admin-nav :: sidebar}"></div>
    <div id="sidebarOverlay" class="d-none position-fixed top-0 start-0 w-100 h-100"
         style="background:rgba(0,0,0,.4);z-index:99;"></div>

    <div class="main-content">
        <div th:replace="~{fragments/admin-nav :: topbar('Gestionare utilizatori')}"></div>

        <div class="page-content">
            <div th:if="${success}" class="alert alert-success alert-dismissible alert-auto-dismiss d-flex align-items-center gap-2 mb-3">
                <i class="bi bi-check-circle-fill"></i><span th:text="${success}"></span>
                <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible d-flex align-items-center gap-2 mb-3">
                <i class="bi bi-exclamation-triangle-fill"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
            </div>

            <div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div>
                    <nav aria-label="breadcrumb" class="mb-1">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}" class="text-decoration-none">Dashboard</a></li>
                            <li class="breadcrumb-item active">Utilizatori</li>
                        </ol>
                    </nav>
                    <h2 class="mb-0"><i class="bi bi-people-fill me-2 text-primary"></i>Gestionare conturi</h2>
                    <p class="text-muted small mb-0" th:text="'Total: ' + ${#lists.size(users)} + ' utilizatori'"></p>
                </div>
            </div>

            
            <div class="row g-3 mb-4">
                <div class="col-sm-4">
                    <div class="content-card text-center py-3">
                        <div class="fw-bold fs-4 text-primary" th:text="${patientCount}">0</div>
                        <div class="text-muted small"><i class="bi bi-person-fill me-1"></i>Pacienți</div>
                    </div>
                </div>
                <div class="col-sm-4">
                    <div class="content-card text-center py-3">
                        <div class="fw-bold fs-4 text-success" th:text="${doctorCount}">0</div>
                        <div class="text-muted small"><i class="bi bi-person-badge-fill me-1"></i>Doctori</div>
                    </div>
                </div>
                <div class="col-sm-4">
                    <div class="content-card text-center py-3">
                        <div class="fw-bold fs-4 text-danger" th:text="${disabledCount}">0</div>
                        <div class="text-muted small"><i class="bi bi-ban me-1"></i>Dezactivate</div>
                    </div>
                </div>
            </div>

            <div class="content-card">
                <div class="content-card-header d-flex justify-content-between align-items-center">
                    <h5 class="content-card-title mb-0"><i class="bi bi-list-ul me-2"></i>Toți utilizatorii</h5>
                    <input type="text" id="userSearch" class="form-control form-control-sm w-auto"
                           placeholder="Caută după email..." style="min-width:220px;">
                </div>
                <div class="content-card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0 align-middle" id="usersTable">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-4">#</th>
                                    <th>Email</th>
                                    <th>Rol</th>
                                    <th>Status</th>
                                    <th class="text-end pe-4">Acțiuni</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="u, stat : ${users}">
                                    <td class="ps-4 text-muted small" th:text="${stat.count}"></td>
                                    <td>
                                        <div class="d-flex align-items-center gap-2">
                                            <div class="rounded-circle d-flex align-items-center justify-content-center flex-shrink-0 fw-bold"
                                                 th:style="${'width:34px;height:34px;font-size:.85rem;' + (u.role == 'ADMIN' ? 'background:#f3e8ff;color:#7c3aed;' : (u.role == 'DOCTOR' ? 'background:#d1fae5;color:#065f46;' : 'background:#dbeafe;color:#1e40af;'))}"
                                                 th:text="${u.email.substring(0,1).toUpperCase()}">
                                            </div>
                                            <span th:text="${u.email}" class="small fw-500"></span>
                                        </div>
                                    </td>
                                    <td>
                                        <span class="badge rounded-pill px-3"
                                              th:style="${u.role == 'ADMIN' ? 'background:#f3e8ff;color:#7c3aed;' : (u.role == 'DOCTOR' ? 'background:#d1fae5;color:#065f46;' : 'background:#dbeafe;color:#1e40af;')}"
                                              th:text="${u.role}"></span>
                                    </td>
                                    <td>
                                        <span th:if="${u.enabled}"
                                              class="badge bg-success-subtle text-success rounded-pill px-3">
                                            <i class="bi bi-check-circle me-1"></i>Activ
                                        </span>
                                        <span th:unless="${u.enabled}"
                                              class="badge bg-danger-subtle text-danger rounded-pill px-3">
                                            <i class="bi bi-slash-circle me-1"></i>Dezactivat
                                        </span>
                                    </td>
                                    <td class="text-end pe-4">
                                        <form th:action="@{'/admin/users/' + ${u.id} + '/toggle'}" method="post"
                                              th:unless="${u.role == 'ADMIN'}">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                            <button type="submit"
                                                    th:class="${u.enabled} ? 'btn btn-sm btn-outline-danger' : 'btn btn-sm btn-outline-success'"
                                                    th:text="${u.enabled} ? 'Dezactivează' : 'Activează'"
                                                    th:onclick="'return confirm(\'Sigur doriți să ' + (${u.enabled} ? 'dezactivați' : 'activați') + ' acest cont?\')'"
                                            ></button>
                                        </form>
                                        <span th:if="${u.role == 'ADMIN'}" class="text-muted small fst-italic">protejat</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<script>
document.getElementById('userSearch').addEventListener('input', function () {
    const q = this.value.toLowerCase();
    document.querySelectorAll('#usersTable tbody tr').forEach(row => {
        row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
});
</script>
</body>
</html>
