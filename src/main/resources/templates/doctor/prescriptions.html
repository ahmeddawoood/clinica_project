<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rețete | MediClinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/doctor-nav :: sidebar(${doctor})}"></div>
    <div id="sidebarOverlay" class="d-none position-fixed top-0 start-0 w-100 h-100" style="background:rgba(0,0,0,.4);z-index:99;"></div>
    <div class="main-content">
        <div th:replace="~{fragments/doctor-nav :: topbar('Rețete medicale')}"></div>
        <div class="page-content">
            <div class="page-header">
                <h2><i class="bi bi-capsule me-2 text-success"></i>Rețete medicale</h2>
            </div>

            <div th:if="${success}" class="alert alert-success d-flex gap-2 align-items-center mb-3">
                <i class="bi bi-check-circle-fill"></i><span th:text="${success}"></span>
            </div>
            <div th:if="${error}" class="alert alert-danger d-flex gap-2 align-items-center mb-3">
                <i class="bi bi-exclamation-triangle-fill"></i><span th:text="${error}"></span>
            </div>

            <div class="row g-4">
                
                <div class="col-lg-4">
                    <div class="content-card">
                        <div class="content-card-header">
                            <h5 class="content-card-title"><i class="bi bi-pencil-square me-2 text-success"></i>Emite rețeta noua</h5>
                        </div>
                        <div class="content-card-body">
                            <form th:action="@{/doctor/prescriptions/save}" th:object="${form}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <div class="mb-3">
                                    <label class="form-label fw-600 small">Pacient <span class="text-danger">*</span></label>
                                    <select th:field="*{patientId}" class="form-select form-select-sm" required>
                                        <option value="">- Selecteaza pacientul -</option>
                                        <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.fullName}"></option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-600 small">Programare (opțional)</label>
                                    <select th:field="*{appointmentId}" class="form-select form-select-sm">
                                        <option value="">- Nicio programare -</option>
                                        <option th:each="a : ${appointments}"
                                                th:if="${a.status == 'CONFIRMED' or a.status == 'COMPLETED'}"
                                                th:value="${a.id}"
                                                th:text="${'#' + a.id + ' - ' + a.patient.fullName + ' - ' + #temporals.format(a.appointmentDate, 'dd MMM yyyy')}"></option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-600 small">Diagnostic</label>
                                    <input th:field="*{diagnosis}" class="form-control form-control-sm" placeholder="ex: Hipertensiune arteriala">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-600 small">Medicamente <span class="text-danger">*</span></label>
                                    <textarea th:field="*{medications}" class="form-control form-control-sm" rows="4"
                                              placeholder="ex: Metformin 500mg - 2x/zi (dimineața și seara)" required></textarea>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-600 small">Instrucțiuni de administrare</label>
                                    <textarea th:field="*{instructions}" class="form-control form-control-sm" rows="3"
                                              placeholder="ex: Se ia dupa masa, cu apa. Evitați alcoolul."></textarea>
                                </div>
                                <button type="submit" class="btn btn-success w-100">
                                    <i class="bi bi-save me-1"></i>Salveaza rețeta
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                
                <div class="col-lg-8">
                    <div class="content-card">
                        <div class="content-card-header">
                            <h5 class="content-card-title"><i class="bi bi-list-ul me-2 text-primary"></i>Rețetele mele emise</h5>
                            <span class="badge bg-secondary" th:text="${#lists.size(prescriptions)}"></span>
                        </div>
                        <div class="content-card-body p-0">
                            <div th:if="${#lists.isEmpty(prescriptions)}" class="text-center text-muted py-5">
                                <i class="bi bi-capsule fs-1 d-block mb-2 opacity-25"></i>
                                Nicio rețeta emisa înca.
                            </div>
                            <div th:each="rx : ${prescriptions}" class="p-3 border-bottom d-flex align-items-start justify-content-between gap-3">
                                <div class="flex-grow-1">
                                    <div class="fw-600 mb-1">
                                        <i class="bi bi-file-medical text-success me-1"></i>
                                        Rețeta #<span th:text="${rx.id}"></span>
                                        &nbsp;-&nbsp;
                                        <span th:text="${rx.patient.fullName}"></span>
                                    </div>
                                    <div class="small text-muted mb-1">
                                        <i class="bi bi-calendar3 me-1"></i>
                                        <span th:text="${#temporals.format(rx.issuedAt, 'dd MMM yyyy, HH:mm')}"></span>
                                        <span th:if="${rx.diagnosis}"> · <span th:text="${rx.diagnosis}"></span></span>
                                    </div>
                                    <div class="small text-truncate" style="max-width:400px;" th:text="${rx.medications}"></div>
                                </div>
                                <a th:href="@{/doctor/prescriptions/{id}/download(id=${rx.id})}"
                                   class="btn btn-sm btn-outline-danger flex-shrink-0">
                                    <i class="bi bi-download"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
