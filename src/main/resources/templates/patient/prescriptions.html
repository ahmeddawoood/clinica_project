<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rețete | MediClinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/patient-nav :: sidebar(${patient})}"></div>
    <div id="sidebarOverlay" class="d-none position-fixed top-0 start-0 w-100 h-100" style="background:rgba(0,0,0,.4);z-index:99;"></div>
    <div class="main-content">
        <div th:replace="~{fragments/patient-nav :: topbar('Rețete medicale')}"></div>
        <div class="page-content">
            <div class="page-header">
                <h2><i class="bi bi-capsule me-2 text-primary"></i>Rețete medicale</h2>
                <p class="text-muted small mb-0">Toate rețetele tale prescrise de medici</p>
            </div>

            <div th:if="${#lists.isEmpty(prescriptions)}" class="content-card text-center py-5">
                <i class="bi bi-capsule fs-1 text-muted opacity-25 d-block mb-3"></i>
                <p class="text-muted">Nu ai rețete medicale emise încă.</p>
            </div>

            <div class="row g-3">
                <div th:each="rx : ${prescriptions}" class="col-md-6">
                    <div class="content-card h-100">
                        <div class="content-card-header">
                            <h6 class="content-card-title">
                                <i class="bi bi-file-medical me-2 text-primary"></i>
                                Rețetă #<span th:text="${rx.id}"></span>
                            </h6>
                            <span class="badge bg-success">ACTIVĂ</span>
                        </div>
                        <div class="content-card-body">
                            <div class="mb-2 small">
                                <i class="bi bi-person-badge me-2 text-muted"></i>
                                <span th:text="'Dr. ' + ${rx.doctor.fullName} + ' - ' + ${rx.doctor.specialty}"></span>
                            </div>
                            <div class="mb-2 small text-muted">
                                <i class="bi bi-calendar3 me-2"></i>
                                <span th:text="${#temporals.format(rx.issuedAt, 'dd MMMM yyyy')}"></span>
                            </div>
                            <div th:if="${rx.diagnosis}" class="mb-3 small">
                                <span class="fw-600">Diagnostic:</span>
                                <span class="text-muted" th:text="${rx.diagnosis}"></span>
                            </div>
                            <div class="mb-3">
                                <div class="section-label small fw-600 text-muted text-uppercase mb-1">Medicamente</div>
                                <div class="small bg-light rounded p-2" style="white-space:pre-wrap;" th:text="${rx.medications}"></div>
                            </div>
                            <div th:if="${rx.instructions}" class="mb-3">
                                <div class="section-label small fw-600 text-muted text-uppercase mb-1">Instrucțiuni</div>
                                <div class="small text-muted" style="white-space:pre-wrap;" th:text="${rx.instructions}"></div>
                            </div>
                            <a th:href="@{/patient/prescriptions/{id}/download(id=${rx.id})}"
                               class="btn btn-sm btn-outline-danger w-100">
                                <i class="bi bi-file-earmark-pdf me-1"></i>Descarcă PDF
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
