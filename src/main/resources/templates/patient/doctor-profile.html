<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Dr. ' + ${doctor.fullName} + ' | MediClinic'">Profil Doctor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        .doctor-hero { background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 50%, #4f46e5 100%);
                       border-radius: 20px; padding: 36px; color: #fff; margin-bottom: 28px; }
        .hero-avatar { width: 88px; height: 88px; border-radius: 50%;
                       background: rgba(255,255,255,.2); border: 3px solid rgba(255,255,255,.4);
                       display: flex; align-items: center; justify-content: center;
                       font-size: 2rem; font-weight: 700; flex-shrink: 0; }
        .stat-pill { background: rgba(255,255,255,.15); border-radius: 12px; padding: 12px 20px;
                     text-align: center; backdrop-filter: blur(4px); }
        .star-filled { color: #f59e0b; }
        .star-empty  { color: rgba(255,255,255,.3); }
        .star-filled-dark { color: #f59e0b; }
        .star-empty-dark  { color: #e2e8f0; }
        .review-card { border-radius: 14px; border: 1.5px solid #f1f5f9;
                       padding: 18px 20px; background: #fafafa; transition: border-color .2s; }
        .review-card:hover { border-color: #bfdbfe; background: #eff6ff; }
        .reviewer-avatar { width: 40px; height: 40px; border-radius: 50%;
                           background: linear-gradient(135deg,#7c3aed,#2563eb);
                           display: flex; align-items: center; justify-content: center;
                           font-size: .9rem; font-weight: 700; color: #fff; flex-shrink: 0; }
        .rating-bar-track { height: 8px; border-radius: 8px; background: #e2e8f0; overflow: hidden; }
        .rating-bar-fill { height: 100%; border-radius: 8px;
                           background: linear-gradient(90deg, #f59e0b, #fbbf24); transition: width .6s ease; }
        .specialty-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 16px;
                           border-radius: 20px; background: rgba(255,255,255,.2);
                           font-size: .85rem; font-weight: 600; }
    </style>
</head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/patient-nav :: sidebar(${patient})}"></div>
    <div id="sidebarOverlay" class="d-none position-fixed top-0 start-0 w-100 h-100"
         style="background:rgba(0,0,0,.4);z-index:99;"></div>

    <div class="main-content">
        <div th:replace="~{fragments/patient-nav :: topbar('Profil Doctor')}"></div>

        <div class="page-content">

            
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb small">
                    <li class="breadcrumb-item"><a th:href="@{/patient/dashboard}" class="text-muted">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/patient/doctors}" class="text-muted">Doctori</a></li>
                    <li class="breadcrumb-item active" th:text="'Dr. ' + ${doctor.fullName}"></li>
                </ol>
            </nav>

            
            <div class="doctor-hero">
                <div class="d-flex flex-wrap align-items-start gap-4 mb-4">
                    <div class="hero-avatar"
                         th:text="${doctor.firstName != null ? doctor.firstName.substring(0,1).toUpperCase() : 'D'}"></div>
                    <div class="flex-grow-1">
                        <h2 class="fw-700 mb-1" th:text="'Dr. ' + ${doctor.fullName}">Dr. Popescu</h2>
                        <div class="specialty-badge mb-2">
                            <i class="bi bi-heart-pulse-fill"></i>
                            <span th:text="${doctor.specialty}">Specialitate</span>
                        </div>
                        <div class="d-flex align-items-center gap-2 mt-2">
                            <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                                <i th:class="${i <= avgRating ? 'bi bi-star-fill star-filled' : 'bi bi-star star-empty'}"
                                   style="font-size:1.1rem;"></i>
                            </th:block>
                            <span class="fw-700 fs-5"
                                  th:text="${#numbers.formatDecimal(avgRating,1,1)}">0.0</span>
                            <span style="opacity:.75;font-size:.85rem;"
                                  th:text="'din ' + ${ratingCount} + ' recenzii'"></span>
                        </div>
                    </div>
                    <a th:href="@{/patient/book(doctorId=${doctor.id})}"
                       class="btn btn-light fw-700 rounded-pill px-4 align-self-start">
                        <i class="bi bi-calendar-check me-2 text-primary"></i>Programează
                    </a>
                </div>

                
                <div class="row g-3">
                    <div class="col-4">
                        <div class="stat-pill">
                            <div class="fw-700 fs-4" th:text="${ratingCount}">0</div>
                            <div style="font-size:.75rem;opacity:.8;">Recenzii</div>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="stat-pill">
                            <div class="fw-700 fs-4"
                                 th:text="${#numbers.formatDecimal(avgRating,1,1)}">0.0</div>
                            <div style="font-size:.75rem;opacity:.8;">Rating mediu</div>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="stat-pill">
                            <div class="fw-700 fs-4">
                                <i class="bi bi-patch-check-fill" style="font-size:1.2rem;"></i>
                            </div>
                            <div style="font-size:.75rem;opacity:.8;">Verificat</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-4">
                
                <div class="col-lg-8">
                    <div class="content-card">
                        <div class="content-card-header">
                            <h5 class="content-card-title">
                                <i class="bi bi-chat-quote me-2 text-primary"></i>
                                Recenzii pacienți
                                <span class="badge bg-primary-subtle text-primary ms-2 rounded-pill"
                                      th:text="${ratingCount}"></span>
                            </h5>
                        </div>
                        <div class="content-card-body">

                            <div th:if="${reviews.isEmpty()}" class="text-center py-4 text-muted">
                                <i class="bi bi-chat-dots fs-1 d-block mb-2 opacity-25"></i>
                                <p class="mb-0">Nu există recenzii încă.</p>
                                <small>Fii primul care evaluează!</small>
                            </div>

                            <div class="d-flex flex-column gap-3" th:if="${!reviews.isEmpty()}">
                                <div class="review-card" th:each="review : ${reviews}">
                                    <div class="d-flex align-items-start gap-3">
                                        <div class="reviewer-avatar"
                                             th:text="${review.patient.firstName != null ? review.patient.firstName.substring(0,1).toUpperCase() : 'P'}">
                                        </div>
                                        <div class="flex-grow-1">
                                            <div class="d-flex justify-content-between align-items-start flex-wrap gap-1">
                                                <span class="fw-700 small"
                                                      th:text="${review.patient.fullName}">Pacient</span>
                                                <span class="text-muted" style="font-size:.72rem;"
                                                      th:text="${#temporals.format(review.createdAt,'dd MMM yyyy')}"></span>
                                            </div>
                                            <div class="d-flex gap-1 my-1">
                                                <th:block th:each="i : ${#numbers.sequence(1,5)}">
                                                    <i th:class="${i <= review.stars ? 'bi bi-star-fill star-filled-dark' : 'bi bi-star star-empty-dark'}"
                                                       style="font-size:.8rem;"></i>
                                                </th:block>
                                            </div>
                                            <p class="text-muted mb-0 small"
                                               th:text="${review.comment != null and !#strings.isEmpty(review.comment) ? review.comment : 'Fără comentariu.'}"
                                               style="line-height:1.5;"></p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>

                
                <div class="col-lg-4">
                    
                    <div class="content-card mb-3">
                        <div class="content-card-header">
                            <h5 class="content-card-title">
                                <i class="bi bi-bar-chart me-2 text-primary"></i>Distribuție note
                            </h5>
                        </div>
                        <div class="content-card-body">
                            <div th:each="star : ${#numbers.sequence(5,1,-1)}" class="d-flex align-items-center gap-2 mb-2"
                                 th:with="cnt=${starCounts[star]}">
                                <span class="text-muted small fw-600" style="width:14px;" th:text="${star}"></span>
                                <i class="bi bi-star-fill star-filled-dark" style="font-size:.75rem;"></i>
                                <div class="rating-bar-track flex-grow-1">
                                    <div class="rating-bar-fill"
                                         th:style="'width:' + ${ratingCount > 0 ? cnt * 100 / ratingCount : 0} + '%'">
                                    </div>
                                </div>
                                <span class="text-muted small" th:text="${cnt}">0</span>
                            </div>
                        </div>
                    </div>

                    
                    <div class="content-card" style="border-left:4px solid #2563eb;">
                        <div class="content-card-body text-center py-3">
                            <div class="mb-3" style="font-size:2.5rem;">👨‍⚕️</div>
                            <h6 class="fw-700 mb-1">Programează o consultație</h6>
                            <p class="text-muted small mb-3">
                                Rezervă un slot cu Dr. <span th:text="${doctor.lastName}"></span>
                                în câteva secunde.
                            </p>
                            <a th:href="@{/patient/book(doctorId=${doctor.id})}"
                               class="btn btn-primary w-100 rounded-pill fw-700">
                                <i class="bi bi-calendar-plus me-2"></i>Programează acum
                            </a>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
