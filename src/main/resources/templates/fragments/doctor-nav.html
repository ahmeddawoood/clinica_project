<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<body>


<div th:fragment="sidebar(doctor)" class="sidebar sidebar-doctor">
    <a th:href="@{/doctor/dashboard}" class="sidebar-brand">
        <div class="sidebar-brand-icon"><i class="bi bi-heart-pulse-fill"></i></div>
        <span class="sidebar-brand-text">MediClinic</span>
    </a>

    <nav class="sidebar-nav">
        <div class="sidebar-section-title">Principal</div>
        <a th:href="@{/doctor/dashboard}" class="sidebar-link">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a>
        <div class="sidebar-section-title mt-3">Activitate</div>
        <a th:href="@{/doctor/queue}" class="sidebar-link">
            <i class="bi bi-people-fill"></i> Coada pacienți
        </a>
        <a th:href="@{/doctor/schedule}" class="sidebar-link">
            <i class="bi bi-calendar-week"></i> Programul meu
        </a>
        <a th:href="@{/doctor/calendar}" class="sidebar-link">
            <i class="bi bi-calendar3"></i> Calendar
        </a>
        <a th:href="@{/doctor/messages}" class="sidebar-link">
            <i class="bi bi-chat-dots"></i> Mesaje
        </a>
        <a th:href="@{/doctor/notifications}" class="sidebar-link d-flex align-items-center justify-content-between">
            <span><i class="bi bi-bell me-1"></i> Notificari</span>
            <span th:if="${unreadNotifCount != null and unreadNotifCount > 0}"
                  class="badge rounded-pill bg-danger"
                  style="font-size:.6rem;"
                  th:text="${unreadNotifCount > 9 ? '9+' : unreadNotifCount}"></span>
        </a>
        <a th:href="@{/doctor/prescriptions}" class="sidebar-link">
            <i class="bi bi-file-medical"></i> Rețete
        </a>
        <div class="sidebar-section-title mt-3">Cont</div>
        <a th:href="@{/doctor/profile}" class="sidebar-link">
            <i class="bi bi-person-badge"></i> Profilul meu
        </a>
    </nav>

    <div class="sidebar-footer">
        <div class="sidebar-user">
            <div class="sidebar-avatar" th:text="${doctor != null and doctor.firstName != null ? doctor.firstName.substring(0,1).toUpperCase() : 'D'}"></div>
            <div class="sidebar-user-info">
                <div class="sidebar-user-name" th:text="${doctor != null ? 'Dr. ' + doctor.fullName : 'Doctor'}"></div>
                <div class="sidebar-user-role" th:text="${doctor != null and doctor.specialty != null ? doctor.specialty : 'Doctor'}"></div>
            </div>
        </div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-light btn-sm w-100">
                <i class="bi bi-box-arrow-right me-1"></i> Logout
            </button>
        </form>
    </div>
</div>


<div th:fragment="topbar(title)" class="top-navbar">
    <span id="csrf-holder"
          th:attr="data-token=${_csrf.token},data-header=${_csrf.headerName}"
          hidden></span>
    <span id="ws-doctor-id" th:attr="data-id=${doctor != null ? doctor.id : ''}" hidden></span>

    <div class="d-flex align-items-center gap-3">
        <button class="mobile-toggle" id="sidebarToggle">
            <i class="bi bi-list fs-5"></i>
        </button>
        <span class="top-navbar-title" th:text="${title}">Dashboard</span>
    </div>
    <div class="top-navbar-actions d-flex align-items-center gap-2">
<div class="dropdown" id="wsBellWrapper" style="display:none!important;">
            <button class="btn btn-sm position-relative p-2" type="button"
                    id="wsBellBtn" data-bs-toggle="dropdown" aria-expanded="false"
                    style="background:transparent;border:none;">
                <i class="bi bi-bell-fill fs-5" style="color:#064e3b;"></i>
                <span id="wsBadge" class="position-absolute top-0 start-100 translate-middle
                      badge rounded-pill bg-danger" style="font-size:.6rem;display:none;">0</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow mt-1" id="wsDropdown"
                style="min-width:300px;max-height:340px;overflow-y:auto;">
                <li><h6 class="dropdown-header d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-bell me-1"></i>Notificari live</span>
                    <span class="badge bg-success-subtle text-success rounded-pill px-2" style="font-size:.65rem;">LIVE</span>
                </h6></li>
                <li id="wsEmpty"><span class="dropdown-item-text text-muted small py-3 d-block text-center">
                    <i class="bi bi-check-circle text-success me-1"></i>Nu ai notificari noi.
                </span></li>
            </ul>
        </div>

        <span th:if="${navBadge != null}" class="position-relative">
            <a th:href="@{/doctor/dashboard}" class="btn btn-sm btn-warning rounded-pill px-3">
                <i class="bi bi-hourglass-split me-1"></i>
                <span th:text="${navBadge}"></span> în așteptare
            </a>
        </span>
        <button id="darkToggle" title="Mod întunecat"><i class="bi bi-moon-fill"></i></button>
        <span class="badge rounded-pill px-3 py-2" style="background:#d1fae5;color:#065f46;">
            <i class="bi bi-person-badge me-1"></i> Doctor
        </span>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
<script>
(function () {
    const doctorIdEl = document.getElementById('ws-doctor-id');
    if (!doctorIdEl) return;
    const doctorId = doctorIdEl.dataset.id;
    if (!doctorId) return;

    const bellWrapper = document.getElementById('wsBellWrapper');
    const badge       = document.getElementById('wsBadge');
    const dropdown    = document.getElementById('wsDropdown');
    const emptyItem   = document.getElementById('wsEmpty');
    let unread = 0;

    function addNotification(msg) {
        emptyItem.style.display = 'none';
        const li = document.createElement('li');
        li.innerHTML = `
          <a class="dropdown-item py-2 px-3 border-bottom" href="/doctor/dashboard" style="white-space:normal;">
            <div class="d-flex align-items-start gap-2">
              <i class="bi bi-calendar-plus-fill mt-1 flex-shrink-0" style="color:#2563eb;font-size:1rem;"></i>
              <div>
                <div class="fw-600 small">Programare noua #${msg.appointmentId}</div>
                <div class="text-muted" style="font-size:.78rem;">${msg.message}</div>
                <div class="text-muted" style="font-size:.7rem;">${msg.actorName} · ${msg.timestamp}</div>
              </div>
            </div>
          </a>`;
        dropdown.querySelector('.dropdown-header').closest('li').insertAdjacentElement('afterend', li);

        unread++;
        badge.textContent = unread > 9 ? '9+' : unread;
        badge.style.display = 'inline';
        bellWrapper.style.removeProperty('display');

        const btn = document.getElementById('wsBellBtn');
        btn.style.animation = 'none'; btn.offsetHeight;
        btn.style.animation = 'wsBellShake .4s ease';
    }

    document.getElementById('wsBellBtn').addEventListener('click', () => {
        unread = 0; badge.style.display = 'none';
    });

    new StompJs.Client({
        webSocketFactory: () => new SockJS('/ws'),
        reconnectDelay: 5000,
        onConnect: () => {
            bellWrapper.style.removeProperty('display');
            this.subscribe(`/topic/doctor/${doctorId}/notifications`,
                frame => { try { addNotification(JSON.parse(frame.body)); } catch(e) {} });
        },
    }).activate();
})();
</script>
<style>
@keyframes wsBellShake {
  0%,100% { transform:rotate(0); } 20% { transform:rotate(-18deg); }
  40% { transform:rotate(18deg); } 60% { transform:rotate(-10deg); } 80% { transform:rotate(10deg); }
}
</style>
</body>
</html>
