<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<body>


<div th:fragment="sidebar" class="sidebar sidebar-admin">
    <a th:href="@{/admin/dashboard}" class="sidebar-brand">
        <div class="sidebar-brand-icon"><i class="bi bi-heart-pulse-fill"></i></div>
        <span class="sidebar-brand-text">MediClinic</span>
    </a>

    <nav class="sidebar-nav">
        <div class="sidebar-section-title">Prezentare generală</div>
        <a th:href="@{/admin/dashboard}" class="sidebar-link">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a>
        <div class="sidebar-section-title mt-3">Management</div>
        <a th:href="@{/admin/patients}" class="sidebar-link">
            <i class="bi bi-people-fill"></i> Pacienți
        </a>
        <a th:href="@{/admin/doctors}" class="sidebar-link">
            <i class="bi bi-person-badge-fill"></i> Doctori
        </a>
        <a th:href="@{/admin/appointments}" class="sidebar-link">
            <i class="bi bi-calendar3"></i> Programări
        </a>
        <a th:href="@{/admin/users}" class="sidebar-link">
            <i class="bi bi-person-lock"></i> Utilizatori
        </a>
        <div class="sidebar-section-title mt-3">Rapoarte</div>
        <a th:href="@{/admin/export/appointments}" class="sidebar-link">
            <i class="bi bi-download"></i> Exportă CSV
        </a>
    </nav>

    <div class="sidebar-footer">
        <div class="sidebar-user">
            <div class="sidebar-avatar" style="background:rgba(255,255,255,.2)">A</div>
            <div class="sidebar-user-info">
                <div class="sidebar-user-name">Administrator</div>
                <div class="sidebar-user-role">Acces complet</div>
            </div>
        </div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-light btn-sm w-100">
                <i class="bi bi-box-arrow-right me-1"></i> Logout
            </button>
        </form>
    </div>
</div>


<div th:fragment="topbar(title)" class="top-navbar">
    <span id="csrf-holder"
          th:attr="data-token=${_csrf.token},data-header=${_csrf.headerName}"
          hidden></span>
    <div class="d-flex align-items-center gap-3">
        <button class="mobile-toggle" id="sidebarToggle">
            <i class="bi bi-list fs-5"></i>
        </button>
        <span class="top-navbar-title" th:text="${title}">Dashboard</span>
    </div>
    <div class="top-navbar-actions d-flex align-items-center gap-2">
        <button id="darkToggle" title="Mod întunecat"><i class="bi bi-moon-fill"></i></button>
        <span class="badge bg-dark rounded-pill px-3 py-2">
            <i class="bi bi-shield-check me-1"></i> Admin
        </span>
    </div>
</div>

</body>
</html>
