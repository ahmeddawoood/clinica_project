<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eroare | MediClinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body style="background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;">
<div class="d-flex align-items-center justify-content-center min-vh-100 p-3">
    <div class="text-center text-white" style="max-width:480px;">
        <div style="font-size:5rem;"><i class="bi bi-exclamation-triangle-fill"></i></div>
        <h2 class="mt-2 mb-3">Oops! A apărut o problemă</h2>

        <div class="alert alert-light text-dark text-start rounded-3 mb-3">
            <div class="fw-bold mb-1"><i class="bi bi-info-circle me-1"></i> Ce s-a întâmplat:</div>
            <div th:text="${message}">Eroare neașteptată.</div>
            <div th:if="${hint}" class="text-muted small mt-2" th:text="${hint}"></div>
        </div>

        <div class="d-flex gap-2 justify-content-center">
            <button onclick="history.back()" class="btn btn-light">
                <i class="bi bi-arrow-left me-1"></i> Înapoi
            </button>
            <a href="/" class="btn btn-outline-light">
                <i class="bi bi-house-fill me-1"></i> Acasă
            </a>
        </div>
    </div>
</div>
</body>
</html>
