<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 - Pagina nu a fost găsită | MediClinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body style="background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;">
<div class="d-flex align-items-center justify-content-center min-vh-100 p-3">
    <div class="text-center text-white">
        <div style="font-size:7rem;font-weight:800;line-height:1;opacity:.9;">404</div>
        <h2 class="mb-2">Pagina nu a fost găsită</h2>
        <p class="mb-4 opacity-75"
           th:text="${message} ?: 'Pagina pe care o cauți nu există sau a fost mutată.'">
            Pagina pe care o cauți nu există sau a fost mutată.
        </p>
        <div class="d-flex gap-2 justify-content-center">
            <button onclick="history.back()" class="btn btn-light fw-600">
                <i class="bi bi-arrow-left me-1"></i> Înapoi
            </button>
            <a href="/" class="btn btn-outline-light fw-600">
                <i class="bi bi-house-fill me-1"></i> Acasă
            </a>
        </div>
    </div>
</div>
</body>
</html>
