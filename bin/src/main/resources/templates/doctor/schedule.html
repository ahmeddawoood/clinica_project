<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Program | MediClinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        .day-card { border-radius:12px; border:1px solid #e2e8f0; padding:14px 18px; transition:.15s; }
        .day-card.available { border-color:#10b981; background:#f0fdf4; }
        .day-card.unavailable { background:#f8fafc; opacity:.7; }
    </style>
</head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/doctor-nav :: sidebar(${doctor})}"></div>
    <div id="sidebarOverlay" class="d-none position-fixed top-0 start-0 w-100 h-100" style="background:rgba(0,0,0,.4);z-index:99;"></div>
    <div class="main-content">
        <div th:replace="~{fragments/doctor-nav :: topbar('Programul meu')}"></div>
        <div class="page-content">
            <div class="page-header">
                <h2><i class="bi bi-calendar-week me-2 text-success"></i>Programul meu săptămânal</h2>
                <p class="text-muted small mb-0">Setează zilele și orele în care ești disponibil pentru consultații</p>
            </div>

            <div th:if="${success}" class="alert alert-success d-flex gap-2 mb-3">
                <i class="bi bi-check-circle-fill"></i><span th:text="${success}"></span>
            </div>

            <form th:action="@{/doctor/schedule/save}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="row g-3">
                    <div th:each="entry : ${days}" class="col-md-6">
                        <div class="day-card"
                             th:classappend="${byDay[entry.key] != null and byDay[entry.key].available} ? ' available' : ' unavailable'"
                             th:id="'card_' + ${entry.key}">
                            <div class="d-flex align-items-center justify-content-between mb-3">
                                <span class="fw-700 text-capitalize" th:text="${entry.value}"></span>
                                <div class="form-check form-switch mb-0">
                                    <input type="checkbox" class="form-check-input"
                                           th:name="'avail_' + ${entry.key}"
                                           th:id="'avail_' + ${entry.key}"
                                           th:checked="${byDay[entry.key] != null and byDay[entry.key].available}"
                                           onchange="toggleDay(this)">
                                </div>
                            </div>
                            <div class="row g-2" th:id="'hours_' + ${entry.key}"
                                 th:style="${byDay[entry.key] != null and !byDay[entry.key].available} ? 'opacity:.4;pointer-events:none' : ''">
                                <div class="col-6">
                                    <label class="form-label small text-muted mb-1">Ora start</label>
                                    <select th:name="'start_' + ${entry.key}" class="form-select form-select-sm">
                                        <option th:each="h : ${#numbers.sequence(6, 17)}"
                                                th:value="${h}"
                                                th:text="${#strings.concat(#strings.length('' + h) == 1 ? '0' : '', h) + ':00'}"
                                                th:selected="${byDay[entry.key] != null and byDay[entry.key].startHour == h}"></option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label class="form-label small text-muted mb-1">Ora sfârșit</label>
                                    <select th:name="'end_' + ${entry.key}" class="form-select form-select-sm">
                                        <option th:each="h : ${#numbers.sequence(7, 22)}"
                                                th:value="${h}"
                                                th:text="${#strings.concat(#strings.length('' + h) == 1 ? '0' : '', h) + ':00'}"
                                                th:selected="${byDay[entry.key] != null and byDay[entry.key].endHour == h}"></option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-success px-5">
                        <i class="bi bi-save me-2"></i>Salvează programul
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<script>
function toggleDay(cb) {
    var day = cb.id.replace('avail_', '');
    var card  = document.getElementById('card_' + day);
    var hours = document.getElementById('hours_' + day);
    if (cb.checked) {
        card.classList.add('available'); card.classList.remove('unavailable');
        hours.style.opacity = '1'; hours.style.pointerEvents = '';
    } else {
        card.classList.remove('available'); card.classList.add('unavailable');
        hours.style.opacity = '.4'; hours.style.pointerEvents = 'none';
    }
}
</script>
</body>
</html>
