<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - MediClinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <i class="bi bi-heart-pulse-fill"></i>
        </div>
        <h2 class="auth-title">Bun venit!</h2>
        <p class="auth-subtitle">Intră în contul tău MediClinic</p>

        <div th:if="${param.error}" class="alert alert-danger alert-auto-dismiss d-flex align-items-center gap-2 mb-3">
            <i class="bi bi-exclamation-triangle-fill"></i>
            Email sau parolă incorectă.
        </div>
        <div th:if="${param.logout}" class="alert alert-info alert-auto-dismiss d-flex align-items-center gap-2 mb-3">
            <i class="bi bi-check-circle-fill"></i>
            Ai fost delogat cu succes.
        </div>
        <div th:if="${param.passwordReset}" class="alert alert-success alert-auto-dismiss d-flex align-items-center gap-2 mb-3">
            <i class="bi bi-check-circle-fill"></i>
            Parola a fost resetată cu succes. Acum te poți autentifica.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Adresă email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="username" class="form-control" placeholder="email@example.com" required autofocus>
                </div>
            </div>
            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center">
                    <label class="form-label mb-0">Parolă</label>
                    <a th:href="@{/forgot-password}" class="text-decoration-none small text-muted">Ai uitat parola?</a>
                </div>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" id="passwordInput" class="form-control" placeholder="••••••••" required>
                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                        <i class="bi bi-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                <i class="bi bi-box-arrow-in-right me-1"></i> Intră în cont
            </button>
        </form>

        <div class="text-center">
            <small class="text-muted">Nu ai cont?
                <a th:href="@{/register}" class="text-decoration-none fw-600">Înregistrează-te gratuit</a>
            </small>
        </div>

        <hr class="my-3">
        <div class="text-center">
            <small class="text-muted">
                <i class="bi bi-info-circle me-1"></i>
                Demo: <code>admin@clinic.com</code> / <code>admin123</code>
            </small>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<script>
    document.getElementById('togglePassword').addEventListener('click', function () {
        const input = document.getElementById('passwordInput');
        const icon  = document.getElementById('eyeIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'bi bi-eye';
        }
    });
</script>
</body>
</html>
