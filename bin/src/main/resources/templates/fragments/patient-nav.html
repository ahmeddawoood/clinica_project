<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<body>


<div th:fragment="sidebar(patient)" class="sidebar sidebar-patient">
    <a th:href="@{/patient/dashboard}" class="sidebar-brand">
        <div class="sidebar-brand-icon"><i class="bi bi-heart-pulse-fill"></i></div>
        <span class="sidebar-brand-text">MediClinic</span>
    </a>

    <nav class="sidebar-nav">
        <div class="sidebar-section-title">Principal</div>
        <a th:href="@{/patient/dashboard}" class="sidebar-link">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a>
        <a th:href="@{/patient/book}" class="sidebar-link">
            <i class="bi bi-calendar-plus"></i> Programare noua
        </a>
        <a th:href="@{/patient/doctors}" class="sidebar-link">
            <i class="bi bi-people"></i> Doctori
        </a>
        <div class="sidebar-section-title mt-3">Servicii</div>
        <a th:href="@{/patient/history}" class="sidebar-link">
            <i class="bi bi-clock-history"></i> Istoric Medical
        </a>
        <a th:href="@{/patient/messages}" class="sidebar-link">
            <i class="bi bi-chat-dots"></i> Mesaje
        </a>
        <a th:href="@{/patient/notifications}" class="sidebar-link d-flex align-items-center justify-content-between">
            <span><i class="bi bi-bell me-1"></i> Notificari</span>
            <span th:if="${unreadNotifCount != null and unreadNotifCount > 0}"
                  class="badge rounded-pill bg-danger"
                  style="font-size:.6rem;"
                  th:text="${unreadNotifCount > 9 ? '9+' : unreadNotifCount}"></span>
        </a>
        <a th:href="@{/patient/prescriptions}" class="sidebar-link">
            <i class="bi bi-file-medical"></i> Re?ete
        </a>
        <div class="sidebar-section-title mt-3">Cont</div>
        <a th:href="@{/patient/profile}" class="sidebar-link">
            <i class="bi bi-person"></i> Profilul meu
        </a>
    </nav>

    <div class="sidebar-footer">
        <div class="sidebar-user">
            <div class="sidebar-avatar" th:text="${patient != null and patient.firstName != null ? patient.firstName.substring(0,1).toUpperCase() : 'P'}"></div>
            <div class="sidebar-user-info">
                <div class="sidebar-user-name" th:text="${patient != null ? patient.fullName : 'Pacient'}"></div>
                <div class="sidebar-user-role">Pacient</div>
            </div>
        </div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-light btn-sm w-100">
                <i class="bi bi-box-arrow-right me-1"></i> Logout
            </button>
        </form>
    </div>
</div>


<div th:fragment="topbar(title)" class="top-navbar">
    <span id="csrf-holder"
          th:attr="data-token=${_csrf.token},data-header=${_csrf.headerName}"
          hidden></span>
    <span id="ws-patient-id" th:attr="data-id=${patient != null ? patient.id : ''}" hidden></span>

    <div class="d-flex align-items-center gap-3">
        <button class="mobile-toggle" id="sidebarToggle">
            <i class="bi bi-list fs-5"></i>
        </button>
        <span class="top-navbar-title" th:text="${title}">Dashboard</span>
    </div>

    <div class="top-navbar-actions d-flex align-items-center gap-2">
<div class="dropdown" id="wsBellWrapper" style="display:none!important;">
            <button class="btn btn-sm position-relative p-2" type="button"
                    id="wsBellBtn" data-bs-toggle="dropdown" aria-expanded="false"
                    style="background:transparent;border:none;">
                <i class="bi bi-bell-fill fs-5" style="color:#64748b;"></i>
                <span id="wsBadge" class="position-absolute top-0 start-100 translate-middle
                      badge rounded-pill bg-danger" style="font-size:.6rem;display:none;">0</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow mt-1" id="wsDropdown"
                style="min-width:300px;max-height:340px;overflow-y:auto;">
                <li><h6 class="dropdown-header d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-bell me-1"></i>Notificari live</span>
                    <span class="badge bg-success-subtle text-success rounded-pill px-2" style="font-size:.65rem;">LIVE</span>
                </h6></li>
                <li id="wsEmpty"><span class="dropdown-item-text text-muted small py-3 d-block text-center">
                    <i class="bi bi-check-circle text-success me-1"></i>Nu ai notificari noi.
                </span></li>
            </ul>
        </div>

        <div th:if="${navBadge != null}" class="dropdown">
            <button class="btn btn-sm btn-warning rounded-pill px-3 dropdown-toggle"
                    type="button"
                    id="patientNotifDropdown"
                    data-bs-toggle="dropdown"
                    data-bs-auto-close="outside"
                    data-bs-strategy="fixed"
                    aria-expanded="false">
                <i class="bi bi-bell-fill me-1"></i>
                <span th:text="${navBadge}"></span> notificari
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm mt-2" aria-labelledby="patientNotifDropdown" style="min-width:280px;">
                <li><h6 class="dropdown-header">Notificari</h6></li>
                <li th:if="${navPendingPayment != null and navPendingPayment > 0}">
                    <a class="dropdown-item d-flex justify-content-between align-items-center" th:href="@{/patient/dashboard}">
                        <span><i class="bi bi-credit-card me-2 text-warning"></i>Plata necesara</span>
                        <span class="badge text-bg-warning" th:text="${navPendingPayment}"></span>
                    </a>
                </li>
                <li th:if="${navPending != null and navPending > 0}">
                    <a class="dropdown-item d-flex justify-content-between align-items-center" th:href="@{/patient/dashboard}">
                        <span><i class="bi bi-hourglass-split me-2 text-primary"></i>Programari in asteptare</span>
                        <span class="badge text-bg-primary" th:text="${navPending}"></span>
                    </a>
                </li>
                <li th:if="${(navPending == null or navPending == 0) and (navPendingPayment == null or navPendingPayment == 0)}">
                    <span class="dropdown-item-text text-muted small">Nu ai notificari noi.</span>
                </li>
            </ul>
        </div>

        <button id="darkToggle" title="Mod �ntunecat"><i class="bi bi-moon-fill"></i></button>
        <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-2">
            <i class="bi bi-person-circle me-1"></i> Pacient
        </span>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
<script>
(function () {
    const patientIdEl = document.getElementById('ws-patient-id');
    if (!patientIdEl) return;
    const patientId = patientIdEl.dataset.id;
    if (!patientId) return;

    const bellWrapper = document.getElementById('wsBellWrapper');
    const badge       = document.getElementById('wsBadge');
    const dropdown    = document.getElementById('wsDropdown');
    const emptyItem   = document.getElementById('wsEmpty');
    let unread = 0;

    const ICONS = {
        CONFIRMED: { icon: 'bi-check-circle-fill', color: '#22c55e', label: 'Confirmata' },
        CANCELLED: { icon: 'bi-x-circle-fill',     color: '#ef4444', label: 'Anulata'   },
        COMPLETED: { icon: 'bi-award-fill',         color: '#2563eb', label: 'Finalizata' },
    };

    function addNotification(msg) {
        const cfg = ICONS[msg.type] || { icon: 'bi-bell-fill', color: '#64748b', label: msg.type };
        emptyItem.style.display = 'none';

        const li = document.createElement('li');
        li.innerHTML = `
          <a class="dropdown-item py-2 px-3 border-bottom" href="/patient/dashboard" style="white-space:normal;">
            <div class="d-flex align-items-start gap-2">
              <i class="bi ${cfg.icon} mt-1 flex-shrink-0" style="color:${cfg.color};font-size:1rem;"></i>
              <div>
                <div class="fw-600 small">${cfg.label} - #${msg.appointmentId}</div>
                <div class="text-muted" style="font-size:.78rem;">${msg.message}</div>
                <div class="text-muted" style="font-size:.7rem;">${msg.actorName} � ${msg.timestamp}</div>
              </div>
            </div>
          </a>`;
        const header = dropdown.querySelector('.dropdown-header').closest('li');
        header.insertAdjacentElement('afterend', li);

        unread++;
        badge.textContent = unread > 9 ? '9+' : unread;
        badge.style.display = 'inline';
        bellWrapper.style.removeProperty('display');
        const btn = document.getElementById('wsBellBtn');
        btn.style.animation = 'none';
        btn.offsetHeight;
        btn.style.animation = 'wsBellShake .4s ease';
    }
    document.getElementById('wsBellBtn').addEventListener('click', () => {
        unread = 0;
        badge.style.display = 'none';
    });

    const client = new StompJs.Client({
        webSocketFactory: () => new SockJS('/ws'),
        reconnectDelay: 5000,
        onConnect: () => {
            bellWrapper.style.removeProperty('display');
            client.subscribe(
                `/topic/patient/${patientId}/notifications`,
                frame => {
                    try { addNotification(JSON.parse(frame.body)); } catch(e) {}
                }
            );
        },
        onStompError: () => {},
    });
    client.activate();
})();
</script>
<style>
@keyframes wsBellShake {
  0%,100% { transform: rotate(0); }
  20%      { transform: rotate(-18deg); }
  40%      { transform: rotate(18deg); }
  60%      { transform: rotate(-10deg); }
  80%      { transform: rotate(10deg); }
}
</style>
</body>
</html>
