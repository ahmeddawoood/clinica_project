<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Doctori | MediClinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        .doctor-card { border-radius: 16px; border: 1.5px solid #e2e8f0; transition: all .25s;
                       background: #fff; overflow: hidden; }
        .doctor-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(37,99,235,.12);
                             border-color: #93c5fd; }
        .doctor-avatar { width: 72px; height: 72px; border-radius: 50%;
                         background: linear-gradient(135deg, #1d4ed8, #7c3aed);
                         display: flex; align-items: center; justify-content: center;
                         font-size: 1.6rem; font-weight: 700; color: #fff; flex-shrink: 0; }
        .star-filled { color: #f59e0b; }
        .star-empty  { color: #e2e8f0; }
        .specialty-chip { display: inline-flex; align-items: center; gap: 5px;
                          padding: 4px 12px; border-radius: 20px; font-size: .78rem; font-weight: 600;
                          background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
        .filter-pill { padding: 6px 16px; border-radius: 20px; border: 1.5px solid #e2e8f0;
                       font-size: .82rem; font-weight: 600; cursor: pointer; transition: all .2s;
                       background: #fff; color: #475569; text-decoration: none; }
        .filter-pill:hover, .filter-pill.active { background: #2563eb; color: #fff; border-color: #2563eb; }
        .rating-bar { height: 4px; border-radius: 4px; background: #e2e8f0; overflow: hidden; }
        .rating-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg,#f59e0b,#fbbf24); }
    </style>
</head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/patient-nav :: sidebar(${patient})}"></div>
    <div id="sidebarOverlay" class="d-none position-fixed top-0 start-0 w-100 h-100"
         style="background:rgba(0,0,0,.4);z-index:99;"></div>

    <div class="main-content">
        <div th:replace="~{fragments/patient-nav :: topbar('Echipa Medicală')}"></div>

        <div class="page-content">

            
            <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
                <div>
                    <h2 class="fw-700 text-dark mb-1">Echipa Medicală</h2>
                    <p class="text-muted mb-0">Descoperă doctorii noștri și rezervă o consultație</p>
                </div>
                <a th:href="@{/patient/book}" class="btn btn-primary rounded-pill px-4">
                    <i class="bi bi-calendar-plus me-2"></i>Programare nouă
                </a>
            </div>

            
            <div class="d-flex flex-wrap gap-2 mb-4">
                <a th:href="@{/patient/doctors}"
                   th:classappend="${selectedSpecialty == '' ? 'active' : ''}"
                   class="filter-pill">
                    <i class="bi bi-grid me-1"></i>Toți
                </a>
                <a th:each="spec : ${specialties}"
                   th:href="@{/patient/doctors(specialty=${spec})}"
                   th:text="${spec}"
                   th:classappend="${selectedSpecialty == spec ? 'active' : ''}"
                   class="filter-pill"></a>
            </div>

            
            <div class="row g-4" th:if="${!doctorCards.isEmpty()}">
                <div class="col-md-6 col-xl-4" th:each="card : ${doctorCards}">
                    <div class="doctor-card h-100 p-4">
                        <div class="d-flex align-items-start gap-3 mb-3">
                            <div class="doctor-avatar"
                                 th:text="${card.doctor.firstName != null ? card.doctor.firstName.substring(0,1).toUpperCase() : 'D'}">
                            </div>
                            <div class="flex-grow-1 min-w-0">
                                <h5 class="fw-700 mb-1 text-truncate"
                                    th:text="'Dr. ' + ${card.doctor.fullName}">Dr. Popescu</h5>
                                <span class="specialty-chip">
                                    <i class="bi bi-heart-pulse"></i>
                                    <span th:text="${card.doctor.specialty}">Specialitate</span>
                                </span>
                            </div>
                        </div>

                        
                        <div class="d-flex align-items-center gap-2 mb-2">
                            <div class="d-flex gap-1">
                                <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                                    <i th:class="${i <= card.avgRating ? 'bi bi-star-fill star-filled' : 'bi bi-star star-empty'}"
                                       style="font-size:.9rem;"></i>
                                </th:block>
                            </div>
                            <span class="fw-700 text-dark" th:text="${#numbers.formatDecimal(card.avgRating,1,1)}">0.0</span>
                            <span class="text-muted small"
                                  th:text="'(' + ${card.ratingCount} + ' recenzii)'"></span>
                        </div>
                        <div class="rating-bar mb-3">
                            <div class="rating-fill"
                                 th:style="'width:' + ${card.avgRating * 20} + '%'"></div>
                        </div>

                        
                        <div class="d-flex gap-2 mt-auto">
                            <a th:href="@{'/patient/doctors/' + ${card.doctor.id}}"
                               class="btn btn-outline-primary btn-sm flex-grow-1 rounded-pill">
                                <i class="bi bi-person me-1"></i>Profil
                            </a>
                            <a th:href="@{/patient/book(doctorId=${card.doctor.id})}"
                               class="btn btn-primary btn-sm flex-grow-1 rounded-pill">
                                <i class="bi bi-calendar-check me-1"></i>Programează
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div th:if="${doctorCards.isEmpty()}" class="text-center py-5 text-muted">
                <i class="bi bi-search fs-1 d-block mb-3"></i>
                <p>Nu există doctori pentru specialitatea selectată.</p>
                <a th:href="@{/patient/doctors}" class="btn btn-outline-primary rounded-pill">
                    Arată toți doctorii
                </a>
            </div>

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
