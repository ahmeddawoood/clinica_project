<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mesaje | MediClinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        .msg-list-item { cursor:pointer; border-left:3px solid transparent; transition:.15s; }
        .msg-list-item:hover { background:#f8fafc; border-left-color:#3b82f6; }
        .msg-unread { border-left-color:#3b82f6!important; background:#eff6ff; font-weight:600; }
        .msg-body-box { background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:18px; white-space:pre-wrap; line-height:1.7; }
        .compose-card { border-radius:14px; border:none; box-shadow:0 2px 16px rgba(0,0,0,.07); }
    </style>
</head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/patient-nav :: sidebar(${patient})}"></div>
    <div id="sidebarOverlay" class="d-none position-fixed top-0 start-0 w-100 h-100" style="background:rgba(0,0,0,.4);z-index:99;"></div>
    <div class="main-content">
        <div th:replace="~{fragments/patient-nav :: topbar('Mesaje')}"></div>
        <div class="page-content">
            <div class="page-header">
                <h2><i class="bi bi-envelope me-2 text-primary"></i>Mesaje</h2>
            </div>

            <div th:if="${success}" class="alert alert-success d-flex gap-2 align-items-center mb-3">
                <i class="bi bi-check-circle-fill"></i><span th:text="${success}"></span>
            </div>

            <div class="row g-4">
                
                <div class="col-lg-3">
                    <div class="compose-card card mb-3">
                        <div class="card-body p-3">
                            <button class="btn btn-primary w-100" data-bs-toggle="collapse" data-bs-target="#composeForm">
                                <i class="bi bi-pencil-square me-2"></i>Mesaj nou
                            </button>
                            <div class="collapse mt-3" id="composeForm">
                                <form th:action="@{/patient/messages/send}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <select name="receiverId" class="form-select form-select-sm mb-2" required>
                                        <option value="">- Alege medicul -</option>
                                        <option th:each="doc : ${doctors}"
                                                th:value="${doc.user.id}"
                                                th:text="'Dr. ' + ${doc.fullName} + ' - ' + ${doc.specialty}"></option>
                                    </select>
                                    <input name="subject" class="form-control form-control-sm mb-2" placeholder="Subiect" required>
                                    <textarea name="body" class="form-control form-control-sm mb-2" rows="4" placeholder="Mesajul tau..." required></textarea>
                                    <button type="submit" class="btn btn-success btn-sm w-100">
                                        <i class="bi bi-send me-1"></i>Trimite
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <div class="list-group">
                        <a th:href="@{/patient/messages}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
                           th:classappend="${section == 'inbox'} ? 'active' : ''">
                            <span><i class="bi bi-inbox me-2"></i>Inbox</span>
                            <span th:if="${unread > 0}" class="badge bg-danger rounded-pill" th:text="${unread}"></span>
                        </a>
                    </div>
                </div>

                
                <div class="col-lg-9">
                    
                    <div th:if="${msg}" class="compose-card card mb-3">
                        <div class="card-header bg-white pt-4 px-4 pb-3">
                            <h5 class="fw-700 mb-1" th:text="${msg.subject}"></h5>
                            <div class="text-muted small">
                                <i class="bi bi-person me-1"></i>
                                <span th:text="${msg.sender.email}"></span>
                                &nbsp;·&nbsp;
                                <i class="bi bi-clock me-1"></i>
                                <span th:text="${#temporals.format(msg.sentAt, 'dd MMM yyyy, HH:mm')}"></span>
                            </div>
                        </div>
                        <div class="card-body p-4">
                            <div class="msg-body-box mb-4" th:text="${msg.body}"></div>
                            <a th:href="@{/patient/messages}" class="btn btn-outline-secondary btn-sm">
                                <i class="bi bi-arrow-left me-1"></i>Înapoi
                            </a>
                        </div>
                    </div>

                    
                    <div th:unless="${msg}" class="compose-card card">
                        <div class="card-header bg-white pt-4 px-4 pb-3">
                            <h6 class="fw-700 mb-0">
                                <i class="bi bi-inbox me-2 text-primary"></i>Inbox
                                <span th:if="${unread > 0}" class="badge bg-danger ms-2" th:text="${unread} + ' necitite'"></span>
                            </h6>
                        </div>
                        <div class="card-body p-0">
                            <div th:if="${#lists.isEmpty(inbox)}" class="text-center text-muted py-5">
                                <i class="bi bi-inbox fs-1 d-block mb-2 opacity-25"></i>
                                Niciun mesaj primit.
                            </div>
                            <div th:each="m : ${inbox}"
                                 class="msg-list-item p-3 border-bottom"
                                 th:classappend="${!m.read} ? 'msg-unread' : ''"
                                 onclick="window.location=this.dataset.href"
                                 th:data-href="@{/patient/messages/{id}(id=${m.id})}">
                                <div class="d-flex align-items-start justify-content-between">
                                    <div>
                                        <div class="small text-muted mb-1">
                                            <i class="bi bi-person me-1"></i><span th:text="${m.sender.email}"></span>
                                        </div>
                                        <div th:text="${m.subject}"></div>
                                        <div class="text-muted small text-truncate" style="max-width:400px;" th:text="${m.body}"></div>
                                    </div>
                                    <div class="text-muted small text-nowrap ms-3">
                                        <span th:text="${#temporals.format(m.sentAt, 'dd MMM, HH:mm')}"></span>
                                        <span th:unless="${m.read}" class="badge bg-primary ms-1">Nou</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    
                    <div th:unless="${msg}" class="compose-card card mt-3">
                        <div class="card-header bg-white pt-3 px-4 pb-2">
                            <h6 class="fw-700 mb-0"><i class="bi bi-send me-2 text-success"></i>Trimise</h6>
                        </div>
                        <div class="card-body p-0">
                            <div th:if="${#lists.isEmpty(sent)}" class="text-center text-muted py-4 small">Niciun mesaj trimis.</div>
                            <div th:each="m : ${sent}" class="msg-list-item p-3 border-bottom">
                                <div class="d-flex justify-content-between">
                                    <div>
                                        <div class="small text-muted mb-1"><i class="bi bi-arrow-right me-1"></i><span th:text="${m.receiver.email}"></span></div>
                                        <div class="small" th:text="${m.subject}"></div>
                                    </div>
                                    <div class="text-muted small text-nowrap ms-3" th:text="${#temporals.format(m.sentAt, 'dd MMM, HH:mm')}"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
