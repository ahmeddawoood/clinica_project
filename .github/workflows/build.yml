name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run Maven tests
        id: maven-test
        continue-on-error: true
        run: ./mvnw test
      - name: Print Maven test reports on failure
        if: steps.maven-test.outcome == 'failure'
        run: |
          echo '===== Surefire reports ====='
          find target/surefire-reports -type f -maxdepth 2 -print -exec sh -c 'echo "===== $1 ====="; cat "$1"' _ {} \; 2>/dev/null || true
          echo '===== Failsafe reports ====='
          find target/failsafe-reports -type f -maxdepth 2 -print -exec sh -c 'echo "===== $1 ====="; cat "$1"' _ {} \; 2>/dev/null || true
      - name: Fail if Maven tests failed
        if: steps.maven-test.outcome == 'failure'
        run: exit 1
